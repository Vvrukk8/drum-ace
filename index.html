<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Drum Ace" />
  <meta name="theme-color" content="#07080c" />
  <title>Drum Ace</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <h1>Drum Ace</h1>
      </div>
      <p class="version">Version 1.0</p>
      <p class="subtitle">Mic hears your drums — green when on</p>
    </header>

    <section class="bpm-panel" aria-label="Target BPM">
      <label class="bpm-label" for="bpmInput">Target BPM</label>
      <div class="bpm-controls">
        <button type="button" class="bpm-btn" id="bpmDown" aria-label="Decrease BPM">−</button>
        <input type="number" id="bpmInput" inputmode="numeric" min="40" max="240" value="120" aria-label="Target BPM value" />
        <button type="button" class="bpm-btn" id="bpmUp" aria-label="Increase BPM">+</button>
      </div>
      <input type="range" id="bpmSlider" min="40" max="240" value="120" aria-label="BPM slider" />
    </section>

    <section class="led-stage" aria-label="Tempo LED bar" aria-live="polite">
      <div class="led-row" id="ledRow" role="img" aria-label="Nine LED tempo zones"></div>
      <div class="led-legend">
        <span>far</span>
        <span class="legend-center">ON</span>
        <span>far</span>
      </div>
    </section>

    <section class="playing" aria-live="polite">
      <span class="readout-label">Playing BPM</span>
      <span class="playing-bpm" id="playingBpm">—</span>
    </section>
    <span class="sr-only" id="errorReadout" hidden>—</span>

    <section class="mic-section">
      <div class="level-meter" aria-hidden="true">
        <div class="level-fill" id="levelFill"></div>
      </div>
      <button type="button" class="mic-btn" id="micBtn" aria-pressed="false">
        <span class="mic-icon" aria-hidden="true">🎤</span>
        <span class="mic-label" id="micLabel">Enable Microphone</span>
      </button>
      <p class="hint" id="statusHint">Grant mic access, then play drums toward the phone.</p>
      <div class="sens-row">
        <label for="sensSlider">Sensitivity</label>
        <input type="range" id="sensSlider" min="1" max="100" value="45" aria-label="Hit detection sensitivity" />
      </div>
    </section>

    <footer class="footer">
      <button type="button" class="ghost-btn" id="resetBtn">Reset</button>
    </footer>
  </div>
  <script src="app.js"></script>
      </body>
</html>
